<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SkillBridge — Skills-Matched Jobs & Internships</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="SkillBridge matches candidates to jobs and internships based on their real verified skills across diverse industries. Employers find talent that fits.">
  <meta name="theme-color" content="#f8fafc">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('skillbridge_theme');
        var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var resolved = pref === 'dark' || (pref === 'system' && prefersDark) ? 'dark' : 'light';
        var root = document.documentElement;
        root.setAttribute('data-theme', resolved);
        root.setAttribute('data-theme-preference', pref);
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', resolved === 'dark' ? '#0b1120' : '#f8fafc');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <app-root></app-root>
</body>
</html>
