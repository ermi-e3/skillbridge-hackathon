
name: Deploy SkillBridge to SmarterASP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Angular dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Angular
        working-directory: frontend
        run: npm run build -- --configuration production

      - name: Copy Angular build to ASP.NET Core wwwroot
        shell: pwsh
        run: |
          $source = "frontend/dist/frontend/browser"
          $destination = "backend/src/SkillBridge.Api/wwwroot"

          if (!(Test-Path $source)) {
            throw "Angular build output not found: $source"
          }

          New-Item -ItemType Directory -Force -Path $destination | Out-Null

          Get-ChildItem -Path $destination -Force |
            Remove-Item -Recurse -Force

          Copy-Item -Path "$source/*" -Destination $destination -Recurse -Force

      - name: Restore .NET dependencies
        run: dotnet restore backend/SkillBridge.sln

      - name: Publish ASP.NET Core
        run: dotnet publish backend/src/SkillBridge.Api/SkillBridge.Api.csproj -c Release -o "${{ github.workspace }}/publish"

      - name: Deploy to SmarterASP using Web Deploy
        shell: pwsh
        env:
          WEBSITE_NAME: ${{ secrets.WEBSITE_NAME }}
          SERVER_COMPUTER_NAME: ${{ secrets.SERVER_COMPUTER_NAME }}
          SERVER_USERNAME: ${{ secrets.SERVER_USERNAME }}
          SERVER_PASSWORD: ${{ secrets.SERVER_PASSWORD }}

        run: |
          $required = @(
            "WEBSITE_NAME",
            "SERVER_COMPUTER_NAME",
            "SERVER_USERNAME",
            "SERVER_PASSWORD"
          )

          foreach ($name in $required) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub secret is missing: $name"
            }
          }

          $msdeploy = @(
            "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe",
            "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $msdeploy) {
            throw "msdeploy.exe was not found on the GitHub Actions runner."
          }

          $sourcePath = Join-Path $env:GITHUB_WORKSPACE "publish"

          if (!(Test-Path $sourcePath)) {
            throw "Published application directory not found: $sourcePath"
          }

          $arguments = @(
            "-verb:sync",
            "-source:contentPath=$sourcePath",
            "-dest:contentPath=$env:WEBSITE_NAME,ComputerName=$env:SERVER_COMPUTER_NAME,UserName=$env:SERVER_USERNAME,Password=$env:SERVER_PASSWORD,AuthType=Basic,includeAcls=False",
            "-allowUntrusted",
            "-disableLink:AppPoolExtension",
            "-disableLink:ContentExtension",
            "-disableLink:CertificateExtension",
            "-enableRule:AppOffline",
            "-enableRule:DoNotDeleteRule"
          )

          & $msdeploy @arguments

          if ($LASTEXITCODE -ne 0) {
            throw "SmarterASP Web Deploy failed with exit code $LASTEXITCODE"
          }

          Write-Host "Deployment completed successfully."
